id: doppelganger
main_class: com.donutsforlife11.doppelganger.Doppelganger
name: Doppelganger
maps: [orange_hollows]
sheriff_count: 1
sheriff_strikes: 3
game_duration: 300
sheriff_resistance: 255
doppelganger_strength: 20
sheriffs_exposed_at_start: false
sheriffs_can_attack_each_other: false
sheriffs_can_attack_doppelgangers: true
doppelgangers_can_attack_each_other: false
doppelgangers_can_attack_sheriffs: true
# Sheriff hits reveal them, but never remove health while sheriff protection is active.
disguise_on_kill: true
teleport_on_kill: true
death_markers: true
visual_lightning_on_kill: true
doppelganger_reveal_time_on_kill: 2
# Omit kill_goal to require all NPCs. An explicit kill_goal can shorten the game.
npc:
  # RODO: Total appearances per participant, including player disguises; 4 players * 3 = 12 townspeople.
  npc_per_player: 3
  target_blocks:
    - minecraft:crafting_table
    - minecraft:furnace
    - minecraft:blast_furnace
    - minecraft:smoker
    - minecraft:barrel
    - minecraft:lectern
    - minecraft:composter
  min_idle_time: 1
  max_idle_time: 2
